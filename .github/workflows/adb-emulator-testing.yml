name: Android ADB Emulator Testing

on:
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  android-adb-test:
    name: Build and test on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run local JVM tests
        run: |
          ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --no-daemon --stacktrace

      - name: Run emulator ADB tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            bash <<'BASH'
            set -euo pipefail

            echo "Starting ADB server..."
            adb kill-server || true
            adb start-server

            echo "Waiting for emulator device..."
            adb devices
            adb wait-for-device

            echo "Waiting for Android boot completion..."
            boot_completed=""
            for i in {1..60}; do
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              echo "Boot check $i/60: sys.boot_completed=${boot_completed:-empty}"

              if [ "$boot_completed" = "1" ]; then
                break
              fi

              sleep 5
            done

            if [ "$boot_completed" != "1" ]; then
              echo "Emulator did not complete boot in expected time."
              adb devices || true
              adb shell getprop || true
              exit 1
            fi

            echo "Unlocking emulator screen..."
            adb shell input keyevent 82 || true

            echo "Disabling animations..."
            adb shell settings put global window_animation_scale 0.0 || true
            adb shell settings put global transition_animation_scale 0.0 || true
            adb shell settings put global animator_duration_scale 0.0 || true

            echo "Final ADB device list:"
            adb devices

            echo "Running connected Android tests..."
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

            echo "ADB emulator testing completed successfully."
            BASH
