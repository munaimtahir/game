name: Android ADB Emulator Testing

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
permissions:
  contents: read

jobs:
  android-adb-test:
    name: Build and test on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run local JVM tests
        run: |
          ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --no-daemon --stacktrace

      - name: Run emulator ADB tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Downgraded from 35 → 34: API 35 google_apis is unreliable on ubuntu-latest (boot timeout).
          # -wipe-data ensures a clean cold boot (no stale snapshot state).
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          # 600s (10 min) gives the emulator a generous boot window on GitHub-hosted runners,
          # which are slower than local machines. Default is 360s, which is too tight for API 34.
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail

            echo "=== ADB device state ==="
            adb devices -l

            echo "=== Unlocking emulator screen ==="
            adb shell input keyevent 82 || true

            echo "=== Disabling animations ==="
            adb shell settings put global window_animation_scale 0.0 || true
            adb shell settings put global transition_animation_scale 0.0 || true
            adb shell settings put global animator_duration_scale 0.0 || true

            echo "=== Running connected Android tests ==="
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

            echo "=== ADB emulator testing completed successfully ==="
