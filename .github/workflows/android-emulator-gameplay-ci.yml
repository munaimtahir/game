name: Android Emulator Gameplay CI

on:
  workflow_dispatch:
    inputs:
      game_target:
        description: "Game target to test"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - lane_drift
          - pulse_orbit
          - stack_drop
      test_level:
        description: "Test level"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
          - screenshots_only
      api_level:
        description: "Android API level"
        required: false
        default: "35"
      retry_failed:
        description: "Retry failed emulator test once"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  pull_request:
    branches:
      - main

concurrency:
  group: android-emulator-gameplay-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-emulator-gameplay-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GAME_TARGET: ${{ inputs.game_target || 'all' }}
      TEST_LEVEL: ${{ inputs.test_level || 'smoke' }}
      API_LEVEL: ${{ inputs.api_level || '34' }} # KVM acceleration requires 34 usually, 35 might be slow on github

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare artifact folders
        run: |
          mkdir -p artifacts/apk artifacts/logs artifacts/logcat artifacts/screenshots artifacts/test-results artifacts/lint artifacts/reports artifacts/ui-dumps artifacts/gameplay-smoke

      - name: Print Android/Gradle environment
        run: |
          if [ -x scripts/ci/print_android_env.sh ]; then
            scripts/ci/print_android_env.sh | tee artifacts/logs/android-env.txt
          else
            ./gradlew --version | tee artifacts/logs/gradle-version.txt
          fi

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace | tee artifacts/logs/assembleDebug.txt

      - name: Run JVM unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace | tee artifacts/logs/testDebugUnitTest.txt

      - name: Run lint
        run: |
          ./gradlew lintDebug --stacktrace | tee artifacts/logs/lintDebug.txt

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run emulator tests and ADB smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb devices
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            if [ "${TEST_LEVEL}" != "screenshots_only" ]; then
              ./gradlew connectedAndroidTest --stacktrace | tee artifacts/logs/connectedAndroidTest.txt || true
            fi

            if [ -x scripts/ci/run_adb_smoke.sh ]; then
              scripts/ci/run_adb_smoke.sh "${GAME_TARGET}" "${TEST_LEVEL}" | tee artifacts/gameplay-smoke/adb-smoke.txt
            fi

            if [ -x scripts/ci/capture_game_screenshots.sh ]; then
              scripts/ci/capture_game_screenshots.sh "${GAME_TARGET}" | tee artifacts/logs/screenshot-capture.txt
            fi

            adb logcat -d > artifacts/logcat/logcat-final.txt || true
            adb shell uiautomator dump /sdcard/window_dump.xml || true
            adb pull /sdcard/window_dump.xml artifacts/ui-dumps/window_dump.xml || true

      - name: Collect Gradle reports
        if: always()
        run: |
          if [ -x scripts/ci/collect_android_artifacts.sh ]; then
            scripts/ci/collect_android_artifacts.sh
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-gameplay-ci-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
