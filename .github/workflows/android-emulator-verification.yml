name: Android Emulator Verification

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode to execute'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - daily_challenge
          - screenshots
          - full
  pull_request:

jobs:
  verify:
    name: Build, test, and verify on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PACKAGE_NAME: com.vexel.offlinearcade
      MAIN_ACTIVITY: .MainActivity
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: |
          chmod +x ./gradlew
          chmod +x scripts/adb_screenshot_smoke.sh || true

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Build debug APK and run Unit Tests
        run: |
          ./gradlew clean assembleDebug test --no-daemon --stacktrace

      - name: Run emulator ADB tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            bash <<'BASH'
            set -euo pipefail

            echo "Starting ADB server..."
            adb kill-server || true
            adb start-server

            echo "Waiting for emulator device..."
            adb devices
            adb wait-for-device

            echo "Waiting for Android boot completion..."
            boot_completed=""
            for i in {1..60}; do
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              echo "Boot check $i/60: sys.boot_completed=${boot_completed:-empty}"

              if [ "$boot_completed" = "1" ]; then
                break
              fi

              sleep 5
            done

            if [ "$boot_completed" != "1" ]; then
              echo "Emulator did not complete boot in expected time."
              exit 1
            fi

            echo "Unlocking emulator screen..."
            adb shell input keyevent 82 || true

            echo "Disabling animations..."
            adb shell settings put global window_animation_scale 0.0 || true
            adb shell settings put global transition_animation_scale 0.0 || true
            adb shell settings put global animator_duration_scale 0.0 || true

            # Execute based on test_mode
            MODE="${{ github.event.inputs.test_mode || 'smoke' }}"
            echo "Running mode: $MODE"

            if [[ "$MODE" == "smoke" || "$MODE" == "full" || "$MODE" == "daily_challenge" ]]; then
              echo "Running connected Android tests..."
              if [[ "$MODE" == "daily_challenge" ]]; then
                ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.vexel.offlinearcade.GameplayDeviceSmokeTest --no-daemon || true
              else
                ./gradlew connectedDebugAndroidTest --no-daemon
              fi
            fi

            if [[ "$MODE" == "screenshots" || "$MODE" == "full" ]]; then
              echo "Running screenshots..."
              if [ -f scripts/adb_screenshot_smoke.sh ]; then
                SKIP_BUILD=1 PACKAGE_NAME="$PACKAGE_NAME" MAIN_ACTIVITY="$MAIN_ACTIVITY" bash scripts/adb_screenshot_smoke.sh
              else
                echo "Screenshot script not found."
              fi
            fi

            echo "Emulator testing phase completed."
            BASH

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: |
            artifacts/adb_screenshots/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14