name: Android Release Readiness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      
      - name: Generate Dummy Keystore for CI Release Build
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"
          echo "storeFile=release.keystore" > key.properties
          echo "storePassword=password" >> key.properties
          echo "keyAlias=release" >> key.properties
          echo "keyPassword=password" >> key.properties

      - name: Build Release Bundle
        run: ./gradlew bundleRelease
        
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
