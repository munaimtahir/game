on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level"
        required: true
        default: "35"
        type: choice
        options:
          - "35"
          - "34"
          - "33"

      emulator_profile:
        description: "AVD profile"
        required: true
        default: "pixel_6"
        type: choice
        options:
          - "pixel_6"
          - "pixel_5"
          - "pixel_4"

      clean_no_cache:
        description: "Clean build without Gradle cache"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      package_name:
        description: "Android applicationId/package name"
        required: true
        default: "com.vexel.offlinearcade"

      main_activity:
        description: "Main Activity"
        required: true
        default: ".MainActivity"

jobs:
  avd-adb-full-test:
    name: Manual AVD ADB full app verification
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      MAIN_ACTIVITY: ${{ inputs.main_activity }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Build debug APK
        if: inputs.clean_no_cache == 'false'
        run: |
          ./gradlew assembleDebug test lint

      - name: Clean no-cache debug build
        if: inputs.clean_no_cache == 'true'
        run: |
          ./gradlew --stop
          ./gradlew clean assembleDebug test lint --no-build-cache --rerun-tasks --no-daemon

      - name: Start AVD and run ADB verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -eu

            echo "## ADB readiness check"
            adb devices
            adb wait-for-device
            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')
            if [ "$BOOT_COMPLETED" != "1" ]; then
              echo "ERROR: Emulator boot_completed=$BOOT_COMPLETED (expected 1)"
              exit 1
            fi
            echo "Emulator fully booted (sys.boot_completed=1)"

            mkdir -p artifacts/adb_full_test
            REPORT="artifacts/adb_full_test/REPORT.md"

            echo "# Manual Android AVD ADB Full App Test" > "$REPORT"
            echo "" >> "$REPORT"
            echo "- Package: $PACKAGE_NAME" >> "$REPORT"
            echo "- Main Activity: $MAIN_ACTIVITY" >> "$REPORT"
            echo "- API Level: ${{ inputs.api_level }}" >> "$REPORT"
            echo "- Emulator Profile: ${{ inputs.emulator_profile }}" >> "$REPORT"
            echo "" >> "$REPORT"

            echo "## ADB Device" >> "$REPORT"
            adb devices | tee -a "$REPORT"
            echo "" >> "$REPORT"

            echo "Android version:"
            adb shell getprop ro.build.version.release | tee -a "$REPORT"

            echo "Disabling animations..."
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            echo "Finding debug APK..."
            APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" ! -name "*androidTest*" ! -name "*unaligned*" | head -n 1)

            if [ -z "$APK_PATH" ]; then
              echo "ERROR: Debug APK not found." | tee -a "$REPORT"
              find . -path "*/build/outputs/apk/*" -type f | tee -a "$REPORT" || true
              exit 1
            fi

            echo "APK: $APK_PATH" | tee -a "$REPORT"

            echo "Installing APK..."
            adb install -r "$APK_PATH" | tee -a "$REPORT"

            echo "Clearing logcat..."
            adb logcat -c || true

            echo "Launching app normally..."
            adb shell am force-stop "$PACKAGE_NAME" || true
            adb shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1
            sleep 5

            echo "Checking foreground activity..."
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | tee -a "$REPORT" || true

            echo "Checking for immediate crashes after normal launch..."
            adb logcat -d > artifacts/adb_full_test/logcat_after_launch.txt

            if grep -E "FATAL EXCEPTION|AndroidRuntime|Process: $PACKAGE_NAME" artifacts/adb_full_test/logcat_after_launch.txt; then
              echo "ERROR: Crash detected after normal app launch." | tee -a "$REPORT"
              exit 1
            fi

            echo "## Debug route ADB verification" >> "$REPORT"

            test_route() {
              ROUTE="$1"
              LABEL="$2"

              echo "Testing route: $ROUTE ($LABEL)"
              echo "- Testing route: $ROUTE ($LABEL)" >> "$REPORT"

              adb logcat -c || true

              adb shell am force-stop "$PACKAGE_NAME" || true
              adb shell am start \
                -n "${PACKAGE_NAME}/${MAIN_ACTIVITY}" \
                --es screenshot_route "$ROUTE"

              sleep 4

              adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | tee -a "$REPORT" || true

              adb logcat -d > "artifacts/adb_full_test/logcat_${ROUTE}.txt"

              if grep -E "FATAL EXCEPTION|AndroidRuntime|Process: $PACKAGE_NAME" "artifacts/adb_full_test/logcat_${ROUTE}.txt"; then
                echo "ERROR: Crash detected on route $ROUTE" | tee -a "$REPORT"
                exit 1
              fi
            }

            test_route "home" "Home"
            test_route "pulse_detail" "Pulse Orbit Detail"
            test_route "pulse_game" "Pulse Orbit Gameplay"
            test_route "lane_detail" "Lane Drift Detail"
            test_route "lane_game" "Lane Drift Gameplay"
            test_route "stack_detail" "Stack Drop Detail"
            test_route "stack_game" "Stack Drop Gameplay"

            echo "## Optional interaction smoke" >> "$REPORT"

            echo "Testing Back button behavior from Stack Game..."
            adb shell input keyevent KEYCODE_BACK || true
            sleep 2
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | tee -a "$REPORT" || true

            echo "Running connected Android tests if configured..."
            echo "## Instrumented tests" >> "$REPORT"

            set +e
            ./gradlew connectedDebugAndroidTest >> artifacts/adb_full_test/connectedDebugAndroidTest.log 2>&1
            CONNECTED_RESULT=$?
            set -e

            if [ "$CONNECTED_RESULT" -eq 0 ]; then
              echo "- connectedDebugAndroidTest: PASS" | tee -a "$REPORT"
            else
              echo "- connectedDebugAndroidTest: FAILED or not configured" | tee -a "$REPORT"
              echo "See connectedDebugAndroidTest.log" >> "$REPORT"
              # Do not fail here if no instrumented tests are configured.
              # Change this to exit 1 later when real instrumentation tests are mandatory.
            fi

            echo "Final logcat dump..."
            adb logcat -d > artifacts/adb_full_test/logcat_final.txt || true

            echo "" >> "$REPORT"
            echo "## Final Status" >> "$REPORT"
            echo "PASS: App installed, launched, all debug routes opened without detected fatal crash." >> "$REPORT"

      - name: Upload ADB full test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adb-full-app-test-artifacts
          path: artifacts/adb_full_test/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
