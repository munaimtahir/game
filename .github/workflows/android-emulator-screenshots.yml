name: Android Emulator Screenshot Smoke Test

on:
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: "Run clean rebuild without Gradle build cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  push:
    branches:
      - main
      - release/**

  pull_request:
    branches:
      - main

jobs:
  emulator-screenshot-smoke:
    name: Build, install, smoke test, and capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PACKAGE_NAME: com.vexel.offlinearcade
      MAIN_ACTIVITY: .MainActivity
      SCREENSHOT_WAIT_SECONDS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Make ADB screenshot script executable
        run: chmod +x scripts/adb_screenshot_smoke.sh

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Fast build check
        if: github.event.inputs.clean_rebuild != 'true'
        run: |
          ./gradlew assembleDebug test lint

      - name: Clean no-cache build check
        if: github.event.inputs.clean_rebuild == 'true'
        run: |
          ./gradlew --stop
          ./gradlew clean assembleDebug test lint --no-build-cache --rerun-tasks --no-daemon

      - name: Run emulator screenshot smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb devices
            SKIP_BUILD=1 PACKAGE_NAME="$PACKAGE_NAME" MAIN_ACTIVITY="$MAIN_ACTIVITY" bash scripts/adb_screenshot_smoke.sh

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshot-pack
          path: |
            artifacts/adb_screenshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
