name: Android Build and Unit Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

env:
  APP_MODULE: app
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"

jobs:
  build-unit-lint:
    name: Build, Unit Tests, and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show project and Gradle environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          ./gradlew --version

      - name: Run clean build, unit tests, lint, and assemble debug APK
        run: |
          ./gradlew clean \
            lintDebug \
            testDebugUnitTest \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-unit-lint-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
